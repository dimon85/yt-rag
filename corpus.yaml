    note: Short and ironic. Little text per video, but dense.
    target_videos: 5

  # --- Separate: a reference on RAG itself ---
  - name: Greg Kamradt
    handle: "@DataIndependent"
    channel_id: UCyR2Ct3pDOeZSRyZH5hPO-Q
    stance: practical
    note: >
      The series on levels of text splitting. Enters the corpus twice: as a
      source of claims, and as a reference for our own chunking configurations.
    target_videos: 4

# ---------------------------------------------------------------------------
# TOPICS — what the golden set is built around
# ---------------------------------------------------------------------------

topics:
  - id: reliability
    name: Reliability and hallucination in agentic coding
    # Spoken form, not the topic name: nobody says "reliability" out loud.
    keywords: [ "broke", "failed", "doesn t work", "hallucinating", "hallucination",
                "hallucinations", "the problem is", "went wrong", "garbage",
                "unreliable", "trust it" ]
    kinds: [ factual, contradiction ]
    note: >
      The richest topic for contradictions. Hype channels show successful runs,
      skeptics show broken ones. Both are right about their own cases.

  - id: cost
    name: Cost, limits, token burn
    keywords: [ "rate limit", "tokens per", "per month", "costs", "expensive",
                "5 hour", "weekly limit", "burn through", "pricing", "subscription" ]
    kinds: [ factual, comparative ]
    note: >
      Here contradictions are often about TIME: pricing and limits changed. The
      best source for "outdated vs. current" questions.

  - id: context-window
    name: Working with a large codebase and context
    keywords: [ "context window", "context length", "compact", "compacting",
                "large codebase",
                "too many files", "runs out of context", "clear the history" ]
    kinds: [ factual, comparative, contradiction ]

  - id: autonomy
    name: How far an agent can be left to work unsupervised
    keywords: [ "let it run", "without supervision", "yolo", "auto accept",
                "babysit", "review every", "hands off", "autonomous" ]
    kinds: [ contradiction ]
    note: A purely ideological disagreement. Few facts, many positions.

  - id: mcp-setup
    name: Setting up MCP servers, and the pitfalls
    keywords: [ "mcp server", "model context protocol", "config json", "stdio",
                "add the server", "mcp setup", "tools available" ]
    kinds: [ factual ]
    note: The most concrete claims, the easiest to pin to an exact span.

  - id: migration
    name: Switching between tools, why people moved from X to Y
    keywords: [ "switched from", "moved to", "instead of", "i stopped using",
                "went back to", "replaced", "better than" ]
    kinds: [ comparative, contradiction ]

  - id: testing
    name: Testing and verifying agent-generated code
    # No bare "ci": whole-word matching would still catch the abbreviation in
    # contexts that have nothing to do with testing.
    keywords: [ "write tests", "unit test", "unit tests", "test coverage",
                "verify the code", "review the diff", "check the output",
                "continuous integration", "test suite" ]
    kinds: [ factual, comparative ]

  - id: absent
    name: Tools absent from the corpus
    kinds: [ negative ]
    note: Questions are built from tools_deliberately_absent.

# ---------------------------------------------------------------------------
# VIDEO SELECTION RULES
# ---------------------------------------------------------------------------

selection_rules:
  - A 12-18 month time range, not only recent videos. Outdated claims are the
    second source of contradictions, alongside differences of opinion.
  - At least 3 different channels per tool, including at least one with stance
    != hype.
  - Video length 8-60 minutes. Shorter ones give too little text; longer streams
    dilute the corpus with noise.
  - Skip videos without a transcript as a normal case, and log the reason.
  - Deduplicate on normalized transcript text, not on youtube_id — the same
    video gets reuploaded.
  - Videos are selected BEFORE the questions are written. Questions follow the
    corpus, not the other way round.

# ---------------------------------------------------------------------------
# TARGET BALANCE (checked during ingest)
# ---------------------------------------------------------------------------

targets:
  total_videos: 78 # sum of target_videos across channels
  min_videos: 30 # floor if the corpus has to be cut
  stance_share:
    hype: 0.35
    practical: 0.44
    skeptical: 0.21
  transcript_kind:
    note: >
      Not a target value but mandatory bookkeeping. Keep manual and generated
      apart — their quality differs, and it is a free extra cut of the results.


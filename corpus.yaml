  # --- Skeptical pole: where the counter-claims come from ---
  - name: Theo - t3.gg
    handle: "@t3dotgg"
    channel_id: UCbRP3c757lWg9M-U7TyEkXA
    stance: skeptical
    note: Sharply critical of AI tooling. Main source for the contra side.
    target_videos: 8

  - name: ThePrimeagen
    handle: "@ThePrimeagen"
    channel_id: UC8ENHE5xdFSwx71u3fDH5Xw

# yt-rag corpus definition
#
# Goal: a polarized corpus. Every tool has both advocates and critics, and
# claims from different points in time. Without that, contradiction coverage
# measures nothing.
#
# NOTE: channel handles are left as TODO on purpose — current @-handles and
# channel activity are not guaranteed. Each one is verified by hand before
# ingest. Channel names are correct; handles may differ.

version: 1

# ---------------------------------------------------------------------------
# TOOLS — the axis the corpus intersects on
# ---------------------------------------------------------------------------
# aliases are critical: transcripts name these tools inconsistently, and
# without synonyms the search for claims fails during golden-set annotation.

tools:
  - id: claude-code
    name: Claude Code
    aliases: [ "claude code", "cc", "anthropic cli", "claude cli", "claude agent" ]
    target_videos: 15

  - id: cursor
    name: Cursor
    aliases: [ "cursor", "cursor composer", "cursor ide", "composer" ]
    target_videos: 15

  - id: codex
    name: OpenAI Codex
    aliases: [ "codex", "openai codex", "codex cli" ]
    target_videos: 12

  - id: mcp
    name: MCP
    aliases: [ "mcp", "model context protocol", "mcp server", "mcp servers" ]
    target_videos: 12

# Dropped after measuring the ingested corpus, not before. Counted over all 78
# transcripts:
#
#   windsurf   4 mentions, 3 videos, 0 channels above the 3-mention threshold
#   copilot   15 mentions, 3 videos, 1 channel
#
# Neither can carry a factual question, and neither can meet the rule of 3
# channels with at least one non-hype. They are NOT moved to
# tools_deliberately_absent either: they are mentioned, so a negative question
# about them could legitimately retrieve something, which is the one thing a
# negative question must not do.
#
# The alternative was topping the corpus up with videos found by searching for
# these tools. Rejected: that turns the corpus from "what these channels
# published" into "what exists about this tool", and the hype/skeptical balance
# the contradiction questions depend on is a property of the channel mix.

# Tools deliberately kept OUT of the corpus — the source of negative questions.
# Questions about them must return nothing. If the system confidently returns
# something, that is a false positive — and almost nobody measures it.
tools_deliberately_absent:
  - id: jetbrains-ai
    name: JetBrains AI Assistant
  - id: amazon-q
    name: Amazon Q Developer
  - id: tabnine
    name: Tabnine
  - id: continue
    name: Continue

# ---------------------------------------------------------------------------
# CHANNELS — the hype ↔ skepticism axis
# ---------------------------------------------------------------------------
# Actual split by target_videos: ~33% hype, ~44% practical, ~23% skeptical.
# There are fewer skeptics by count, but they yield the most counter-claims
# per unit of text.

channels:
  # --- Hype pole: high volume, fast reviews, "what shipped this week" ---
  - name: Matthew Berman
    handle: "@matthew_berman"
    channel_id: UCawZsQWqfGSbCI5yjkdVkTA
    stance: hype
    note: Reviews everything, many head-to-head videos. Main source of positive
      claims.

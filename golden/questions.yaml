        side: pro
        note: >
          Aliases every agent to launch with dangerous permissions by default
          and calls typing the flag each time inefficient. Note the same video
          later qualifies this ("do not ever use yolo mode without guardrails"),
          which is why the span is pinned to the operational claim.
      - video: P1KpxzLVg7c
        start_s: 2283
        end_s: 2334.04
        side: contra
        note: >
          "I just don't have trust in my AI agent team... sometimes it doesn't
          fire off." A scheduled task that silently failed to run.
      # PILOT: the cross-video contradiction case, which nothing else covers.
      # Both channels are stance=hype, so the disagreement is genuine rather
      # than an artefact of how the corpus was assembled. It also happens to be
      # the minimal-coverage case: this is the only video carrying a "the agent
      # failed while unattended" claim, so the contra side has exactly one
      # source and top-k has one chance to find it.

      # ── negatives, batch 2 ──────────────────────────────────────────────────────
      # All four tools in `tools_deliberately_absent` (corpus.yaml). Verified absent
      # from the 78 cached transcripts: tabnine, jetbrains/intellij/pycharm,
      # "amazon q"/"q developer"/codewhisperer and continue.dev return zero hits.
      #
      # Deliberately mixed in difficulty. The easy ones name a thing only the absent
      # tool has, so nothing in the corpus is even lexically close. The hard ones are
      # phrased in the corpus's own vocabulary — context window, rate limits, yolo
      # mode, MCP servers, unit tests — so the nearest neighbour is always non-empty
      # and a retriever that answers from the closest chunk will answer wrongly.
      # That is the false positive these questions exist to catch, and a set of only
      # easy negatives would report a clean abstention rate that means nothing.


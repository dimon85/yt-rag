  # ── comparative, batch 3 ────────────────────────────────────────────────────
  # `pnpm pairs --relation complement --topic X`, which searches a subject
  # across every tool instead of a tool across every subject. Eleven candidates;
  # five written. Four were dropped for being outside what this corpus is about
  # — a geopolitical argument about distillation, a security incident, a model's
  # token counts — and two for spans the ad filter flagged.
  #
  # A sixth was held back deliberately: human review against programmatic
  # verifiers, whose first span is the same 96 seconds as
  # subagent-fresh-context-tradeoff below. Two questions sharing a gold span
  # score together, and a paired comparison assumes they do not. Better one
  # short of the target than two questions that half-move as one.

  - slug: subagent-fresh-context-tradeoff
    text: What do you lose by giving a sub-agent a clean slate instead of everything
      the main agent knows?
    kind: comparative
    topics:
      - context-window
      - autonomy
    tools:
      - claude-code
    source: hand
    gold:
      - video: zbmuiaPuiNM
        start_s: 716.24
        end_s: 812.4
        note: >
          Cole Medin on why the split is wanted: planning and coding go in two
          sessions because the planning agent "is going to build up a lot of
          context... you want to avoid context rot and a lot of bias".
      - video: 7B2HJr0Y68g
        start_s: 1527.28
        end_s: 1624.4
        note: >
          IndyDevDan on the bill for it: "by definition, every sub agent having
          its own context means that there is no context history... it's
          literally like calling a one-shot prompt", and they are hard to debug.


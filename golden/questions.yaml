  - slug: cc-third-party-policy-reversal
    text: Can the Claude subscription be used via third-party agent tools?
    kind: contradiction
    topics:
      - migration
      - cost
    tools:
      - claude-code
    gold:
      # Added after `pnpm pairs` made the defect visible: every gold span here
      # came from one video, so any retriever returning two nearby chunks scored
      # full contradiction coverage. The dispute is between authors, and until
      # this span was added the question could not measure that.
      - video: HAkSUBdsd6M
        start_s: 807.72
        end_s: 859.12
        side: pro
        note: >
          Cole Medin, asserting it in his own voice rather than reporting it:
          "you are allowed to use your Anthropic or Codex subscription with the
          harness... so you don't have to pay for API credits", attributed to an
          Anthropic team member's clarification.
      - video: 8IDzBRRFnQU
        start_s: 547.24
        end_s: 563.04
        side: pro
        note: Reports later permission for CLI-style usage, qualified by the production
          API recommendation; not unlimited third-party permission.
      # Both spans above and below are 8IDzBRRFnQU reporting a timeline of other
      # people's statements — the video quotes the permission and the ban alike.
      # That made the contra label fragile: retrieval could return it and a
      # reader would not know which side it argued. These two are the same
      # claim asserted by the authors themselves, which is what the side label
      # is supposed to mean.
      - video: f8cfH5XX-XU
        start_s: 1617.12
        end_s: 1712.56
        side: contra
        note: >
          IndyDevDan in his own voice: "they're really locking down the usage of
          their plan. You can really only use their plan on cloud code or the
          API keys... They finally shut it down."
      - video: Q7n0PGbMW_U
        start_s: 807.16
        end_s: 902.24
        side: contra
        note: >
          Theo: "how strict Anthropic is about how you can use your sub, banning
          people for even having Open Claude mentioned in their commit history".
      - video: 8IDzBRRFnQU
        start_s: 474.84
        end_s: 494.56
        side: contra
        note: Reports the earlier blanket exclusion. Both statements occur in the same
          recording; this is a policy reversal, not two simultaneous policies.
